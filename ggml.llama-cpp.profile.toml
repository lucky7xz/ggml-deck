[[commands]]
name = "🌐 Launch WebUI Service"
description = """
Each command starts one llama-server. A cached model launches in the background; a model that is not cached yet downloads in the foreground first, so you can watch progress. Every server listens on port 8033 and is reachable at http://127.0.0.1:8033 — the bind host is set per command (--host 127.0.0.1 for loopback only, --host 0.0.0.0 to also expose it on your LAN).

To add a model, copy any line below and change the repo id and the flags:
  serve.sh <hf-repo-id> [llama-server flags...]
serve.sh handles the cache check, the foreground download, the background launch and the PID/log report. See 'View serve.sh' in Documentation.

First run after a summon: use 'Make Scripts Executable' in the Deck Scripts cell (Column A) once — drako copies assets without the executable bit.
"""
