[[commands]]
name = "💾 Manage Models"
description = "Inspect, launch and delete GGUF models in the Hugging Face cache (~/.cache/huggingface/hub). 'Launch Cached Model' runs anything listed here without editing this profile. Both cells need 'Make Scripts Executable' (Deck Scripts, Column A) run once after a summon."
col = "C"
row = 0
items = [
    { name = "List Models", description = "Lists one row per cached quant, largest first. Each row is a ready-to-paste -hf argument (provider/model:QUANT) you can drop straight into a serve.sh command. A repo holding two quants shows as two rows, not one summed line. Abandoned part-downloads are listed separately, since they are not usable.", command = "~/.config/drako/assets/ggml.llama-cpp/models.sh list", auto_close_execution = false },

    { name = "🚀 Launch Cached Model", description = "Pick any cached model and run it, without editing this profile. Asks three things: which model (chosen from the cache, or a repo id you type), server or TUI, and \u2014 for a server \u2014 whether to bind 127.0.0.1 or 0.0.0.0. Launches with the deck's standard flags (--jinja -c 0 --port 8033 for a server, -c 0 for the TUI); it does NOT set --n-cpu-moe or batch tuning, so for large MoE models on a small GPU use the dedicated cells in 'Launch WebUI Service' instead.", command = "~/.config/drako/assets/ggml.llama-cpp/models.sh launch", auto_close_execution = false },

    { name = "Remove Model", description = "Select a model folder to delete entirely from the Hugging Face cache.", command = """
#!/bin/bash
CACHE_DIR="$HOME/.cache/huggingface/hub"
cd "$CACHE_DIR" || { echo "Cache dir not found"; exit 1; }
shopt -s nullglob 2>/dev/null || setopt nullglob 2>/dev/null

# Target huggingface model directories
dirs=(models--*)
[ ${#dirs[@]} -eq 0 ] && { echo "No models found."; exit 0; }

echo "Select a model to DELETE:"
PS3="#? "
select dir in "${dirs[@]}"; do
    if [ -n "$dir" ]; then
        echo -e "\\n⚠️  Delete the entire model folder '$dir'? (y/n)"
        read -r answer
        case "$answer" in
            [Yy]* ) rm -rf "$dir"; echo "✅ Deleted."; ;;
            * ) echo "❌ Cancelled."; ;;
        esac
        break
    else
        echo "Invalid selection."
    fi
done
""", auto_close_execution = false }
]

