#=======================================================================================================================
# ┌─ COLUMN C: Models & Docs ─────────────────────────────────────────────────────────────────────────────────────────┐
# │ Manage Models
# └─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┘
[[commands]]
name = "💾 Manage Models"
description = "Manage GGUF models downloaded to the local cache (~/.cache/llama.cpp)."
col = "C"
row = 0
items = [
    { name = "List Models", description = "List all GGUF models and their sizes.", command = """
#!/bin/bash
echo "📂 Location: ~/.cache/huggingface/hub/"
echo "---------------------------------------------------"
du -sh ~/.cache/huggingface/hub/models--* 2>/dev/null | awk '{print $1, $2}' | sed "s|$HOME/.cache/huggingface/hub/||"
echo "---------------------------------------------------"
""", auto_close_execution = false },
    { name = "Remove Model", description = "Select a model folder to delete entirely from the Hugging Face cache.", command = """
#!/bin/bash
CACHE_DIR="$HOME/.cache/huggingface/hub"
cd "$CACHE_DIR" || { echo "Cache dir not found"; exit 1; }
shopt -s nullglob 2>/dev/null || setopt nullglob 2>/dev/null

# Target huggingface model directories
dirs=(models--*)
[ ${#dirs[@]} -eq 0 ] && { echo "No models found."; exit 0; }

echo "Select a model to DELETE:"
PS3="#? "
select dir in "${dirs[@]}"; do
    if [ -n "$dir" ]; then
        echo -e "\\n⚠️  Delete the entire model folder '$dir'? (y/n)"
        read -r answer
        case "$answer" in
            [Yy]* ) rm -rf "$dir"; echo "✅ Deleted."; ;;
            * ) echo "❌ Cancelled."; ;;
        esac
        break
    else
        echo "Invalid selection."
    fi
done
""", auto_close_execution = false }
]

