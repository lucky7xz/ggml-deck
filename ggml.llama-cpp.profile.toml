[[commands]]
name = "📥 Setup Tutorial"
description = "Access the official GitHub releases page to download pre-compiled binaries for your machine. Rename the unzipped binary folder to 'llama.cpp'."
col = "A"
row = 0
items = [
  { name = "Open Releases Page", description = "Opens the latest llama.cpp releases page in your browser. Download a pre-compiled release, unpack it, and rename the main directory to 'llama.cpp', placing it in your home folder (~/llama.cpp/llama-server, llama-cli, ...etc) to match the expected paths in Quick Start.", command = "xdg-open https://github.com/ggerganov/llama.cpp/releases/latest >/dev/null 2>&1 &", auto_close_execution = true },
  
  { name = "Open Target Directory", description ="Once the compressed file is downloaded, move the compressed file to this destination. Unpack the file and rename the folder to 'llama.cpp'. Make sure the binary files are not in a subfolder!", command = "xdg-open $HOME", auto_close_execution = true },

  { name = "🔍 Inspect Folder Setup", description = "Verify that llama.cpp directory and binaries are correctly placed in $HOME/llama.cpp.", command = """
#!/bin/bash
DIR="$HOME/llama.cpp"
echo "🔍 Checking llama.cpp installation..."
echo "-----------------------------------------------"
check_file() {
    if [ -f "$DIR/$1" ]; then echo "✅ Found: $1"; else echo "❌ MISSING: $1"; ERR=1; fi
}
[ -d "$DIR" ] && echo "✅ Directory: $DIR" || { echo "❌ MISSING: Directory $DIR"; ERR=1; }
check_file "llama-cli"
check_file "llama-server"
check_file "llama-bench"
echo "-----------------------------------------------"
if [ "$ERR" == "1" ]; then
    echo "💡 Tip: Make sure binaries are in '$DIR' and NOT in a subfolder."
else
    echo "🚀 All there! Setup looks correct."
fi
""", auto_close_execution = false },

  { name = " -- Open Build Docs -- ", description ="Opens the official llama.cpp build guide (CUDA, Metal, Vulkan, BLAS) in your browser. Read this before using the compile commands below.", command = "xdg-open https://github.com/ggml-org/llama.cpp/blob/master/docs/build.md >/dev/null 2>&1 &" },

  { name = "Clone Source", description ="Clones the llama.cpp source into a 'llama.cpp' folder in the current directory. Only needed if you compile from source instead of using a release binary.", command = "git clone https://github.com/ggml-org/llama.cpp.git", auto_close_execution = false },

  { name = "cmake w/ CUDA", description ="Configuration step only, run from inside the cloned source folder. Note that 'cmake build' below already does this, so you rarely need it on its own.", command = "cmake -B build -DGGML_CUDA=ON", auto_close_execution = false },

  { name = "cmake build", description ="Configures and compiles a CUDA build from inside the cloned source folder. Binaries land in ./build/bin, but the rest of this deck expects them directly in ~/llama.cpp — copy them up after the build.", command = """

  cmake -B build -DGGML_CUDA=ON
  cmake --build build --config Release -j

  """, auto_close_execution = false },

  { name = "nvcc version", description ="Prints the CUDA compiler version. Use it to confirm the CUDA toolkit is installed before attempting a GPU build.", command = "nvcc --version", auto_close_execution = false },

  { name = "apt cuda and cmake", description ="Installs the CUDA toolkit and cmake via apt (Debian/Ubuntu only). Prompts for your sudo password.", command = "sudo apt update && sudo apt install nvidia-cuda-toolkit cmake", auto_close_execution = false },

  
]

[[commands]]
name = "🔧 Deck Scripts"
description = "The deck ships two scripts, serve.sh and models.sh, copied to ~/.config/drako/assets/ggml.llama-cpp/ when you summon it. Drako copies assets without the executable bit, so run 'Make Scripts Executable' once after every summon — until you do, the WebUI server commands, List Models and Launch Cached Model will all fail with 'Permission denied'."
col = "A"
row = 1
items = [
  { name = "🔧 Make Scripts Executable", description = "Adds +x to every .sh in the deck's asset folder. Run once after a summon, and again after any re-summon.", command = """
#!/bin/bash
DIR="$HOME/.config/drako/assets/ggml.llama-cpp"
shopt -s nullglob
scripts=("$DIR"/*.sh)
if [ ${#scripts[@]} -eq 0 ]; then
    echo "❌ No scripts found in: $DIR"
    echo "💡 Assets are copied by 'drako summon'. Re-summon the deck to deploy them."
    exit 1
fi
chmod +x "${scripts[@]}" && echo "✅ Made executable:"
ls -l "${scripts[@]}"
""", auto_close_execution = false },

  { name = "🔍 Check Scripts", description = "Lists the deployed scripts and their permissions without changing anything, so you can see whether the +x step is still needed.", command = """
#!/bin/bash
DIR="$HOME/.config/drako/assets/ggml.llama-cpp"
echo "📂 $DIR"
echo "-----------------------------------------------"
shopt -s nullglob
scripts=("$DIR"/*.sh)
if [ ${#scripts[@]} -eq 0 ]; then
    echo "❌ No scripts deployed. Re-summon the deck."
    exit 1
fi
ERR=0
for s in "${scripts[@]}"; do
    if [ -x "$s" ]; then echo "✅ executable: ${s##*/}"; else echo "❌ not executable: ${s##*/}"; ERR=1; fi
done
echo "-----------------------------------------------"
[ "$ERR" = "1" ] && echo "💡 Run 'Make Scripts Executable'." || echo "🚀 All set."
""", auto_close_execution = false }
]

[[commands]]
name = "🛑 Stop All Services"
description = "Stops all running llama-server and llama-cli processes."
col = "A"
row = 2
items = [
  { name = "Stop All Servers", description = "Terminates every llama-server and llama-cli process by exact binary name, then waits 3s and reports anything still running.", command = '''
#!/bin/bash
# Use -x (exact match) to target the binary names specifically.
# This prevents matching this script's own command line arguments.

echo "🛑 Stopping services..."
pkill -x llama-server && echo " - Terminated llama-server"
pkill -x llama-cli    && echo " - Terminated llama-cli"

echo "⏳ Verifying (3s)..."
sleep 3

# Check if any processes with the exact binary name remain
if pgrep -x "llama-server" >/dev/null || pgrep -x "llama-cli" >/dev/null; then
    echo "⚠️  Warning: Processes still running:"
    pgrep -a -x llama-server
    pgrep -a -x llama-cli
else
    echo "✅ All stopped."
fi
exit 0
''', auto_close_execution = false }
]

