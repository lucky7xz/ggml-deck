    { name = "Start Qwen2.5-Omni-3B-GGUF WebUI Server (CPU)", description = "Launches the Qwen2.5-Omni-3B-GGUF model WebUI. Downloads in foreground if missing.", command = """
if ! find ~/.cache/huggingface/hub/ -name "*Qwen2.5-Omni-3B-GGUF*" -print -quit | grep -q .; then
    echo "⚠️  Model not found. Downloading and running in FOREGROUND..."
