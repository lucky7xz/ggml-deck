[[commands]]
name = " ⏱️ Benchmarks"
description = "Measure model performance with llama-bench."
col = "C"
row = 2
items = [
    { name = "Run Benchmark", description = "Prompts for a Hugging Face repo id (not a file path) plus thread and GPU-layer counts, then runs llama-bench in the background. Results go to ~/llama.cpp/server.log, not to this window.", command = """
#!/bin/bash
read -p 'Enter Hugging Face repo id (e.g. ggml-org/Qwen3-0.6B-GGUF): ' model_path
read -p 'Enter number of threads (e.g., 8): ' threads
read -p 'Enter number of GPU layers (e.g., 35): ' ngl
$HOME/llama.cpp/build/bin/llama-bench -hf "$model_path" -t "$threads" -ngl "$ngl" > ~/llama.cpp/server.log 2>&1 &
""", auto_close_execution = false }
]
